html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 16px 4px;max-width:1100px;margin:auto}h1{font-size:18px;margin:0}header small{color:var(--mu)}
nav{display:flex;gap:6px;padding:8px 16px;overflow-x:auto;max-width:1100px;margin:auto}
button{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
button.on,button.p{background:var(--ac);border-color:var(--ac);color:#fff}
main{padding:8px 16px 40px;max-width:1100px;margin:auto}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h3{margin:0 0 10px;font-size:15px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}
input,select{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;min-width:0;width:100%;box-sizing:border-box}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{font-size:12px;color:var(--mu);white-space:nowrap}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.h1 td{background:var(--ab);font-weight:700}tr.h2 td{font-weight:600}tr.i td:first-child{padding-left:24px}
tr.s td{font-weight:600;border-top:1.5px solid var(--tx)}tr.gt td{font-weight:700;background:var(--ab)}
.ok{color:var(--ac)}.er{color:var(--rd)}.mu{color:var(--mu)}
.rh{text-align:center;margin-bottom:10px}.rh b{display:block;font-size:16px}
.sg{display:flex;justify-content:flex-end;margin-top:20px}.sg div{text-align:center;min-width:220px}
.w{grid-column:1/-1}
header{max-width:none;margin:0;padding:20px 16px 18px;background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff;border-radius:0 0 18px 18px}header h1{color:#fff;font-size:21px}header small{color:rgba(255,255,255,.88)}
nav{padding-top:14px}nav button{border-radius:999px;border-color:transparent;background:var(--cd);box-shadow:0 1px 3px rgba(20,40,60,.12)}nav button:hover{background:var(--ab)}nav button.on{background:linear-gradient(120deg,var(--g1),var(--g2));color:#fff}
button.p{background:linear-gradient(120deg,var(--g1),var(--g2));border-color:transparent}
.card{border-top:4px solid var(--g1);box-shadow:0 2px 10px rgba(20,40,60,.08)}.card:nth-of-type(3n+2){border-top-color:var(--g2)}.card:nth-of-type(3n){border-top-color:var(--am)}
h3{color:var(--g1);font-size:16px}th{background:var(--th);color:var(--tx)}
tr.h1 td{background:var(--g1);color:#fff}tr.gt td{background:var(--g2);color:#fff}tr.s td{border-top:2px solid var(--g1)}
.kp{border-radius:12px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,var(--g1),#14b8a6)}.kp:nth-child(2){background:linear-gradient(135deg,var(--g2),#38bdf8)}.kp:nth-child(3){background:linear-gradient(135deg,#d97706,var(--am))}.kp b{display:block;font-size:21px}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;font-weight:600;font-size:12px}.okb{background:rgba(16,185,129,.18);color:var(--g1)}.erb{background:rgba(220,38,38,.15);color:var(--rd)}
#who{margin-top:8px;font-size:13px}.chip{background:rgba(255,255,255,.22);border-radius:999px;padding:2px 12px;font-size:12px;margin-left:6px}body.nadm .adm{display:none!important}
@media print{nav,header,.np{display:none}body{background:#fff;color:#000}.card{border:0}}

bp(){const rw=ui.rw;return Object.entries(BPT).map(([k,t])=>{const ns=S.bp[k]||[];return`<div class="card"><h3>${t}</h3><table><tr><th>Nama</th><th class="n">Saldo</th><th></th></tr>${ns.map((x,i)=>`<tr><td>${esc(x)}</td><td class="n">${fmt(sm(r=>r.bp==x))}</td><td><button onclick="ui.rw=S.bp.${k}[${i}];render()">Riwayat</button></td></tr>`).join('')}<tr class="s"><td>Total</td><td class="n">${fmt(ns.reduce((s,x)=>s+sm(r=>r.bp==x),0))}</td><td></td></tr></table><p class="np adm"><input id="nb_${k}" placeholder="Nama baru" style="max-width:220px"> <button onclick="addBP('${k}')">Tambah</button></p></div>`}).join('')+(rw?`<div class="card"><h3>Riwayat: ${esc(rw)}</h3><div class="sc"><table><tr><th>Tanggal</th><th>Keterangan</th><th class="n">Debit</th><th class="n">Kredit</th></tr>${S.jur.filter(r=>r.bp==rw).sort((x,y)=>x.t.localeCompare(y.t)).map(r=>`<tr><td>${r.t}</td><td>${esc(r.ket)}</td><td class="n">${r.d?fmt(r.d):''}</td><td class="n">${r.k?fmt(r.k):''}</td></tr>`).join('')}</table></div></div>`:'')}};
V.log=()=>{const a=SRV?LOG:S.log;return`<div class="card"><h3>Log aktivitas</h3><div class="sc"><table><tr><th>Waktu</th><th>Pengguna</th><th>Aktivitas</th><th>Keterangan</th></tr>${a.map(e=>`<tr><td style="white-space:nowrap">${new Date(e.t).toLocaleString('id-ID')}</td><td>${esc(nm(e.u))}</td><td><span class="pill okb">${esc(e.aksi)}</span></td><td>${esc(e.detail)}</td></tr>`).join('')||'<tr><td colspan="4" class="mu">Belum ada aktivitas</td></tr>'}</table></div></div>`};
